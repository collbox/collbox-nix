name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    name: check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Builds every package for this runner's system; the other
      # systems are only evaluated, which their own jobs cover.
      # --keep-going so one failure doesn't cancel the other builds.
      - run: nix flake check -L --keep-going
      - if: matrix.system == 'x86_64-linux'
        run: nix fmt -- --ci
